name: Desktop builds

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run tests
        run: npm test

  build-windows:
    name: Build Windows MSI
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare portable WiX
        run: npm run setup:wix

      - name: Build MSI
        run: npm run make:win

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: SCADA-Desktop-Windows-x64
          path: 'out/make/wix/x64/SCADA Desktop.msi'
          if-no-files-found: error
          retention-days: 14

  build-astra-linux:
    name: Build Astra Linux 1.7/1.8 DEB
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install DEB packaging tools
        run: sudo apt-get update && sudo apt-get install --yes fakeroot dpkg

      - name: Build DEB
        run: npm run make:linux

      - name: Verify Astra Linux 1.7 compatibility
        run: npm run verify:deb

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v7
        with:
          name: SCADA-Desktop-Astra-Linux-x64
          path: 'out/make/deb/x64/*.deb'
          if-no-files-found: error
          retention-days: 14
